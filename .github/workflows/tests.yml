name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        start-method: ["fork", "spawn"]
        exclude:
          # Windows does not support the fork start method
          - os: windows-latest
            start-method: "fork"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Pytest
        env:
          PARALLEL_START_METHOD: ${{ matrix.start-method }}
        run: |
          pytest -ra -v --durations=0
          
      - name: Upload Server Debug Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: server-logs-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.start-method }}
          path: server_debug.log
          if-no-files-found: ignore
          
          
          
