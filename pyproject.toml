
[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata] 
allow-direct-references = true

[project]
name = "dmanage"
version = "0.0.4"
authors = [
  { name="Marcus Pearlman", email="marcuspearlman@boisestate.edu" },
]
description = "A package for generating, organizing, and processing data."
readme = "README.rst"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# license = "MIT"
# license-files = ["LICEN[CS]E*"]

dependencies = [
  "natsort",           # for numerically sorting of filenames 
  "numpy",             # data manipulation
  "matplotlib",        # for plotting
  "tabulate",          # For generate text charts on plots?
]

[project.optional-dependencies]

#### DataFrame packages
pandas = ["pandas"]             # pandas DataFrames
polars = ["polars"]               # polars DataFrames
xarray = ["xarray"]               # xarray is like a dataframe

#### calculations
scipy = ["scipy"]               # filter options

#### remote packages
remote = ["Pyro5-with-pickle", "paramiko"]
Pyro5 = ["Pyro5"]
Pyro5-with-pickle = ["Pyro5-with-pickle"]    # for rpc functionality
paramiko = ["paramiko"]            # ssh functionality
xlib = ["python-xlib"]           # for ssh and passing x, currently not working

#### file related packages
zarrcache = ["xarray", "zarr"]           # for reading/writing zarr files
parquetcache = ["fastparquet"]           # reading/writing parquet files
cache = ["xarray", "zarr", "fastparquet"]# all cache
h5py = ["h5py"]                          # for reading/writing h5 files
tables = ["tables"]                      # for reading/writing h5 files, alternate
openpyxl = ["openpyxl"]                  # for pandas excel functionality

#### processing
dill = ["multiprocess"]                  # for dill multiprocessing

#### visualization Packages
plotly = ["plotly", "dash"]
hvplot = ["hvplot"]

#### package suites
all = [
    "Pyro5-with-pickle",
    "paramiko",
    "xarray",
    "zarr",
    "fastparquet",
    "tables",
    "h5py",
    "multiprocess",
    "pandas",
    "hvplot",
]

#### testing
test = [
    "pytest>=8.0",
    "pandas",
    "numpy",
    "fastparquet",
    "zarr",
    "xarray",
    "Pyro5-with-pickle",
    "scipy",
]

#### documentation
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-rtd-dark-mode",
    "sphinxcontrib-spelling",
    "nbsphinx",
    "nbconvert[webpdf]",
    "nbformat",
    "ipykernel",
    "notebook",
    "Pyro5-with-pickle",
]

#### developer workflow tooling
dev = [
    "ruff",         # Fast linting and code formatting
    "mypy",         # Type checking
    "pre-commit",   # Git hooks automation
    "build",        # Package building
    "twine",        # PyPI uploading
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Match Zarr warning by message pattern
    "ignore:.*Consolidated metadata is currently not part.*:UserWarning",
    
    # Match fastparquet/NumPy warning by message pattern
    "ignore:.*The 'generic' unit for NumPy timedelta is deprecated.*:DeprecationWarning",
    
    # multiprocessing 'fork' warnings
    "ignore:This process .* is multi-threaded, use of fork.. may lead to deadlocks:DeprecationWarning",
    ]
markers = [
    "requires_rpc_server: mark test as requiring a running RPC daemon",
    ]

[project.scripts]
dmanage-factory = "dmanage.rstrata.server:main"

[project.urls]
Homepage = "https://github.com/pearlmam/dmanage/"
Issues = "https://github.com/pearlmam/dmanage/issues"
